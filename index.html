<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Clicker Mini App v1.4</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: radial-gradient(circle at 50% 30%, #ff6b2b 0%, #d93800 60%, #8f1d00 100%);
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        /* Верхняя панель */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            font-size: 15px;
            font-weight: 600;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .energy-info {
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(255, 255, 255, 0.15);
            padding: 6px 12px;
            border-radius: 20px;
        }

        /* Центральная рабочая область */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 20px;
        }

        /* Вкладки */
        .tab-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            text-align: center;
        }

        .tab-screen.active {
            display: flex;
        }

        /* Счётчик тапов */
        .score-label {
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.85;
            margin-bottom: 5px;
        }

        .score-value {
            font-size: 52px;
            font-weight: 800;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            margin-bottom: 40px;
        }

        /* Главная кнопка кликера */
        .click-btn {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #38bdf8, #0284c7 60%, #0369a1 100%);
            border: 6px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4), inset 0 5px 15px rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 110px;
            cursor: pointer;
            transition: transform 0.08s ease, box-shadow 0.08s ease;
            position: relative;
        }

        .click-btn:active {
            transform: scale(0.93);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
        }

        /* Всплывающая цифра */
        .floating-plus {
            position: absolute;
            font-size: 28px;
            font-weight: bold;
            color: #fff;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-80px) scale(1.3); }
        }

        /* Карточки для вкладок Прокачка и Новости */
        .card-box {
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(10px);
            padding: 25px 20px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 340px;
            width: 100%;
            text-align: center;
        }

        .card-box h2 {
            font-size: 24px;
            margin-bottom: 15px;
        }

        /* Кнопка улучшения в магазине */
        .upgrade-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .upgrade-title {
            font-size: 16px;
            font-weight: bold;
        }

        .upgrade-desc {
            font-size: 13px;
            opacity: 0.8;
        }

        .upgrade-btn {
            background: #ffd166;
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        .upgrade-btn:active {
            transform: scale(0.97);
        }

        .upgrade-btn:disabled {
            background: rgba(255, 255, 255, 0.3);
            color: rgba(255, 255, 255, 0.6);
            cursor: not-allowed;
        }

        /* Нижняя панель навигации */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(12px);
            padding: 12px 10px 22px 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            padding: 6px 16px;
            border-radius: 14px;
            transition: all 0.2s;
        }

        .nav-btn.active {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.15);
        }

        .nav-icon {
            font-size: 22px;
        }

        /* Окно регистрации */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }

        .modal-box {
            background: #1e1e24;
            padding: 28px 24px;
            border-radius: 24px;
            width: 100%;
            max-width: 340px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .modal-box h3 {
            margin-bottom: 10px;
            font-size: 22px;
        }

        .modal-box p {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 20px;
        }

        .modal-box input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #444;
            background: #2b2b33;
            color: #fff;
            font-size: 16px;
            margin-bottom: 16px;
            outline: none;
            text-align: center;
        }

        .modal-box button {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: #ff5500;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Окно регистрации -->
    <div class="modal-overlay" id="regModal" style="display: none;">
        <div class="modal-box">
            <h3>Добро пожаловать!</h3>
            <p>Придумай имя игрока перед началом игры</p>
            <input type="text" id="usernameInput" placeholder="Твой никнейм..." maxlength="15">
            <button onclick="saveUsername()">Начать игру</button>
        </div>
    </div>

    <!-- Верхняя панель -->
    <div class="header">
        <div class="player-info">
            <span>👤</span>
            <span id="displayUsername">Игрок</span>
        </div>
        <div class="energy-info">
            <span>⚡</span>
            <span id="displayEnergy">5000</span> / 5000
        </div>
    </div>

    <!-- Центральная часть -->
    <div class="main-content">
        
        <!-- Вкладка 1: Прокачка -->
        <div class="tab-screen" id="tab-upgrade">
            <div class="card-box">
                <h2>⬆️ Прокачка силы</h2>
                <div class="upgrade-card">
                    <div class="upgrade-title" id="upgradeTitle">Сила тапа: +1</div>
                    <div class="upgrade-desc" id="upgradeDesc">Увеличить силу тапа до +2</div>
                    <button class="upgrade-btn" id="upgradeBtn" onclick="buyUpgrade()">Купить за 100 🪙</button>
                </div>
            </div>
        </div>

        <!-- Вкладка 2: Кликер (Главная) -->
        <div class="tab-screen active" id="tab-clicker">
            <div class="score-label">Количество тапов</div>
            <div class="score-value" id="displayScore">0</div>
            
            <div class="click-btn" id="clickBtn">
                😗
            </div>
        </div>

        <!-- Вкладка 3: Новости -->
        <div class="tab-screen" id="tab-news">
            <div class="card-box">
                <h2>📢 Новости</h2>
                <p><b>Версия 1.4 (Максимальная прокачка)</b><br>Добавлен лимит улучшений силы тапа до +10!</p>
            </div>
        </div>

    </div>

    <!-- Нижнее меню -->
    <div class="bottom-nav">
        <button class="nav-btn" onclick="switchTab('upgrade', this)">
            <span class="nav-icon">⬆️</span>
            <span>Прокачка</span>
        </button>
        <button class="nav-btn active" onclick="switchTab('clicker', this)">
            <span class="nav-icon">🖱️</span>
            <span>Кликер</span>
        </button>
        <button class="nav-btn" onclick="switchTab('news', this)">
            <span class="nav-icon">📢</span>
            <span>Новости</span>
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const MAX_ENERGY = 5000;
        let score = parseInt(localStorage.getItem('clicker_score')) || 0;
        let energy = localStorage.getItem('clicker_energy') !== null ? parseInt(localStorage.getItem('clicker_energy')) : MAX_ENERGY;
        let username = localStorage.getItem('clicker_username') || '';
        
        let tapPower = parseInt(localStorage.getItem('clicker_tapPower')) || 1;
        let tapLevel = parseInt(localStorage.getItem('clicker_tapLevel')) || 0; 

        // Восстановление энергии в офлайне
        const ENERGY_COOLDOWN = 1000;
        let lastSavedTime = localStorage.getItem('lastExitTime');

        if (lastSavedTime) {
            let elapsedMs = Date.now() - Number(lastSavedTime);
            let elapsedSeconds = Math.floor(elapsedMs / 1000);
            let restoredEnergy = Math.floor(elapsedSeconds * (1000 / ENERGY_COOLDOWN));
            
            if (restoredEnergy > 0) {
                energy = Math.min(MAX_ENERGY, energy + restoredEnergy);
            }
        }

        window.addEventListener('beforeunload', () => {
            localStorage.setItem('lastExitTime', Date.now());
            saveGameData();
        });

        setInterval(() => {
            localStorage.setItem('lastExitTime', Date.now());
            saveGameData();
        }, 3000);

        const displayScore = document.getElementById('displayScore');
        const displayEnergy = document.getElementById('displayEnergy');
        const displayUsername = document.getElementById('displayUsername');
        const regModal = document.getElementById('regModal');
        const clickBtn = document.getElementById('clickBtn');
        const upgradeTitle = document.getElementById('upgradeTitle');
        const upgradeDesc = document.getElementById('upgradeDesc');
        const upgradeBtn = document.getElementById('upgradeBtn');

        if (!username) {
            regModal.style.display = 'flex';
        } else {
            displayUsername.textContent = username;
        }

        function saveUsername() {
            const input = document.getElementById('usernameInput').value.trim();
            if (input.length > 0) {
                username = input;
                localStorage.setItem('clicker_username', username);
                displayUsername.textContent = username;
                regModal.style.display = 'none';
            } else {
                alert('Пожалуйста, введи имя!');
            }
        }

        function saveGameData() {
            localStorage.setItem('clicker_score', score);
            localStorage.setItem('clicker_energy', energy);
            localStorage.setItem('clicker_tapPower', tapPower);
            localStorage.setItem('clicker_tapLevel', tapLevel);
        }

        // Обновление интерфейса магазина с лимитом
        function updateUI() {
            displayScore.textContent = score.toLocaleString('ru-RU');
            displayEnergy.textContent = energy;
            saveGameData();

            if (tapLevel === 0) {
                upgradeTitle.textContent = "Сила тапа: +1";
                upgradeDesc.textContent = "Увеличить силу тапа до +2";
                upgradeBtn.textContent = "Купить за 100 🪙";
                upgradeBtn.disabled = score < 100;
            } else if (tapLevel === 1) {
                upgradeTitle.textContent = "Сила тапа: +2";
                upgradeDesc.textContent = "Увеличить силу тапа до +5";
                upgradeBtn.textContent = "Купить за 1 000 🪙";
                upgradeBtn.disabled = score < 1000;
            } else if (tapLevel === 2) {
                upgradeTitle.textContent = "Сила тапа: +5";
                upgradeDesc.textContent = "Увеличить силу тапа до +10 (Максимум)";
                upgradeBtn.textContent = "Купить за 5 000 🪙";
                upgradeBtn.disabled = score < 5000;
            } else {
                upgradeTitle.textContent = "Сила тапа: +10 (МАКСИМУМ)";
                upgradeDesc.textContent = "Достигнут предел прокачки силы!";
                upgradeBtn.textContent = "Успех 🎉";
                upgradeBtn.disabled = true;
            }
        }

        // Последовательная покупка с ограничением уровня
        function buyUpgrade() {
            if (tapLevel === 0 && score >= 100) {
                score -= 100;
                tapPower = 2;
                tapLevel = 1;
            } else if (tapLevel === 1 && score >= 1000) {
                score -= 1000;
                tapPower = 5;
                tapLevel = 2;
            } else if (tapLevel === 2 && score >= 5000) {
                score -= 5000;
                tapPower = 10;
                tapLevel = 3; // Максимальный уровень
            }
            updateUI();
        }

        clickBtn.addEventListener('pointerdown', (e) => {
            if (energy >= tapPower) {
                score += tapPower;
                energy -= tapPower;
                updateUI();

                if (tg.HapticFeedback) {
                    tg.HapticFeedback.impactOccurred('medium');
                }

                createFloatingText(e.clientX, e.clientY, `+${tapPower}`);
            }
        });

        function createFloatingText(x, y, text) {
            const plus = document.createElement('div');
            plus.className = 'floating-plus';
            plus.textContent = text;
            plus.style.left = `${x - 15}px`;
            plus.style.top = `${y - 30}px`;
            document.body.appendChild(plus);

            setTimeout(() => {
                plus.remove();
            }, 800);
        }

        setInterval(() => {
            if (energy < MAX_ENERGY) {
                energy += 1;
                updateUI();
            }
        }, 1000);

        function switchTab(tabName, btnElement) {
            document.querySelectorAll('.tab-screen').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));

            document.getElementById('tab-' + tabName).classList.add('active');
            btnElement.classList.add('active');
        }

        updateUI();
    </script>
</body>
</html>
