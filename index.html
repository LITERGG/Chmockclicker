<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Core Upgrades</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 18%, #1e293b 0%, #0b1120 65%, #050811 100%);
      color: #f8fafc;
      overflow: hidden;
      touch-action: manipulation;
    }

    .app {
      width: 100%;
      height: 100%;
      max-width: 520px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 12px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 16px;
      padding: 12px 16px;
    }

    .coins {
      font-size: 24px;
      font-weight: 900;
      color: #facc15;
      font-variant-numeric: tabular-nums;
    }

    .rates {
      text-align: right;
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.4;
      font-variant-numeric: tabular-nums;
    }

    .stage {
      flex: 1;
      min-height: 220px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 22px;
      overflow: hidden;
    }

    .orbit {
      position: relative;
      width: 210px;
      height: 210px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .drone {
      position: absolute;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fef08a, #f97316);
      box-shadow: 0 0 14px rgba(251, 146, 60, 0.9);
      display: none;
      pointer-events: none;
    }

    .core-btn {
      width: 148px;
      height: 148px;
      border-radius: 50%;
      border: 4px solid rgba(125, 211, 252, 0.75);
      background: radial-gradient(circle at 35% 30%, #7dd3fc, #0284c7 62%, #1d4ed8 100%);
      box-shadow: 0 0 36px rgba(14, 165, 233, 0.45), inset 0 6px 18px rgba(255, 255, 255, 0.45);
      color: #ffffff;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0.6px;
      cursor: pointer;
      transition: transform 0.07s ease, box-shadow 0.15s ease;
      z-index: 2;
    }

    .core-btn:active {
      transform: scale(0.92);
    }

    .core-btn.overdrive {
      border-color: #fde047;
      background: radial-gradient(circle at 35% 30%, #fde047, #f97316 65%, #db2777 100%);
      box-shadow: 0 0 44px rgba(249, 115, 22, 0.75), inset 0 6px 18px rgba(255, 255, 255, 0.55);
    }

    .surge-btn {
      margin-top: 10px;
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid rgba(250, 204, 21, 0.5);
      background: rgba(250, 204, 21, 0.16);
      color: #fde047;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      z-index: 2;
    }

    .surge-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .float-dmg {
      position: absolute;
      font-weight: 900;
      font-size: 18px;
      pointer-events: none;
      animation: flyUp 0.65s ease-out forwards;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
      z-index: 5;
    }

    @keyframes flyUp {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(0.95); }
      100% { opacity: 0; transform: translate(-50%, -130%) scale(1.2); }
    }

    .shop {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      max-height: 46%;
      overflow-y: auto;
    }

    .upg {
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 16px;
      padding: 11px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
    }

    .upg-name {
      font-size: 13px;
      font-weight: 800;
      color: #f8fafc;
    }

    .upg-stat {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }

    .upg-btn {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 10px;
      background: #38bdf8;
      color: #061322;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      font-variant-numeric: tabular-nums;
    }

    .upg-btn:disabled {
      background: rgba(51, 65, 85, 0.7);
      color: #94a3b8;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="top">
      <div class="coins" id="coinsEl">0</div>
      <div class="rates">
        <div id="tapInfoEl">Удар: +1</div>
        <div id="autoInfoEl">Авто: +0/с • Крит: 5%</div>
      </div>
    </div>

    <div class="stage" id="stageEl">
      <div class="orbit">
        <div class="drone" id="drone1"></div>
        <div class="drone" id="drone2"></div>
        <button class="core-btn" id="coreBtn">УДАР</button>
      </div>
      <button class="surge-btn" id="surgeBtn">⚡ Перегруз x2 (готово)</button>
    </div>

    <div class="shop">
      <div class="upg">
        <div>
          <div class="upg-name">Сила удара</div>
          <div class="upg-stat" id="statTap">Ур. 1 • +1 за клик</div>
        </div>
        <button class="upg-btn" id="buyTapBtn">15</button>
      </div>

      <div class="upg">
        <div>
          <div class="upg-name">Авто-дрон</div>
          <div class="upg-stat" id="statAuto">Ур. 0 • +0/сек</div>
        </div>
        <button class="upg-btn" id="buyAutoBtn">35</button>
      </div>

      <div class="upg">
        <div>
          <div class="upg-name">Шанс крита</div>
          <div class="upg-stat" id="statCrit">Ур. 0 • 5% (x3)</div>
        </div>
        <button class="upg-btn" id="buyCritBtn">50</button>
      </div>

      <div class="upg">
        <div>
          <div class="upg-name">Множитель ядра</div>
          <div class="upg-stat" id="statMult">Ур. 1 • x1.0 бонус</div>
        </div>
        <button class="upg-btn" id="buyMultBtn">120</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const stageEl = document.getElementById('stageEl');
      const coreBtn = document.getElementById('coreBtn');
      const surgeBtn = document.getElementById('surgeBtn');
      const drone1 = document.getElementById('drone1');
      const drone2 = document.getElementById('drone2');

      const coinsEl = document.getElementById('coinsEl');
      const tapInfoEl = document.getElementById('tapInfoEl');
      const autoInfoEl = document.getElementById('autoInfoEl');

      const statTap = document.getElementById('statTap');
      const statAuto = document.getElementById('statAuto');
      const statCrit = document.getElementById('statCrit');
      const statMult = document.getElementById('statMult');

      const buyTapBtn = document.getElementById('buyTapBtn');
      const buyAutoBtn = document.getElementById('buyAutoBtn');
      const buyCritBtn = document.getElementById('buyCritBtn');
      const buyMultBtn = document.getElementById('buyMultBtn');

      let coins = 0;
      let tapLvl = 1;
      let autoLvl = 0;
      let critLvl = 0;
      let multLvl = 1;

      let overdriveLeft = 0;
      let surgeCooldown = 0;
      let droneAngle = 0;
      let autoAcc = 0;
      let lastTime = performance.now();

      try {
        const saved = JSON.parse(localStorage.getItem('core_upg_save') || 'null');
        if (saved) {
          coins = Number(saved.coins) || 0;
          tapLvl = Math.max(1, Number(saved.tapLvl) || 1);
          autoLvl = Math.max(0, Number(saved.autoLvl) || 0);
          critLvl = Math.max(0, Number(saved.critLvl) || 0);
          multLvl = Math.max(1, Number(saved.multLvl) || 1);
        }
      } catch (e) {}

      function saveGame() {
        try {
          localStorage.setItem('core_upg_save', JSON.stringify({
            coins: Math.floor(coins),
            tapLvl: tapLvl,
            autoLvl: autoLvl,
            critLvl: critLvl,
            multLvl: multLvl
          }));
        } catch (e) {}
      }

      function getTapBase() {
        return tapLvl + Math.floor((tapLvl - 1) * (tapLvl - 1) * 0.6);
      }
      function getTapCost() {
        return Math.floor(15 * Math.pow(1.55, tapLvl - 1));
      }

      function getAutoBase() {
        return autoLvl === 0 ? 0 : autoLvl * 2 + Math.floor(autoLvl * autoLvl * 0.5);
      }
      function getAutoCost() {
        return Math.floor(35 * Math.pow(1.65, autoLvl));
      }

      function getCritChance() {
        return Math.min(0.65, 0.05 + critLvl * 0.05);
      }
      function getCritCost() {
        return Math.floor(50 * Math.pow(1.7, critLvl));
      }

      function getCoreMult() {
        return 1 + (multLvl - 1) * 0.25;
      }
      function getMultCost() {
        return Math.floor(120 * Math.pow(1.9, multLvl - 1));
      }

      function getActiveBoost() {
        return overdriveLeft > 0 ? 2 : 1;
      }

      function spawnFloat(x, y, text, color) {
        const el = document.createElement('div');
        el.className = 'float-dmg';
        el.textContent = text;
        el.style.left = x + 'px';
        el.style.top = y + 'px';
        el.style.color = color || '#ffffff';
        stageEl.appendChild(el);
        setTimeout(function () {
          if (el.parentNode) el.parentNode.removeChild(el);
        }, 650);
      }

      function hitCore(clientX, clientY, isAuto) {
        const boost = getActiveBoost();
        const mult = getCoreMult();
        const base = isAuto ? getAutoBase() : getTapBase();
        if (base <= 0) return;

        const isCrit = Math.random() < getCritChance();
        const gained = Math.max(1, Math.round(base * mult * boost * (isCrit ? 3 : 1)));
        coins += gained;

        const rect = stageEl.getBoundingClientRect();
        const px = typeof clientX === 'number'
          ? clientX - rect.left + (Math.random() * 24 - 12)
          : rect.width / 2 + (Math.random() * 70 - 35);
        const py = typeof clientY === 'number'
          ? clientY - rect.top - 10
          : rect.height / 2 - 20 + (Math.random() * 40 - 20);

        spawnFloat(
          px,
          py,
          (isCrit ? 'CRIT +' : '+') + gained,
          isCrit ? '#fde047' : (isAuto ? '#7dd3fc' : '#ffffff')
        );
        updateUI();
      }

      coreBtn.addEventListener('pointerdown', function (e) {
        hitCore(e.clientX, e.clientY, false);
      });

      surgeBtn.addEventListener('click', function () {
        if (overdriveLeft <= 0 && surgeCooldown <= 0) {
          overdriveLeft = 7;
          surgeCooldown = 22;
          updateUI();
        }
      });

      buyTapBtn.addEventListener('click', function () {
        const c = getTapCost();
        if (coins >= c) { coins -= c; tapLvl += 1; saveGame(); updateUI(); }
      });

      buyAutoBtn.addEventListener('click', function () {
        const c = getAutoCost();
        if (coins >= c) { coins -= c; autoLvl += 1; saveGame(); updateUI(); }
      });

      buyCritBtn.addEventListener('click', function () {
        const c = getCritCost();
        if (coins >= c) { coins -= c; critLvl += 1; saveGame(); updateUI(); }
      });

      buyMultBtn.addEventListener('click', function () {
        const c = getMultCost();
        if (coins >= c) { coins -= c; multLvl += 1; saveGame(); updateUI(); }
      });

      function updateUI() {
        const boost = getActiveBoost();
        const mult = getCoreMult();
        const effectiveTap = Math.round(getTapBase() * mult * boost);
        const effectiveAuto = Math.round(getAutoBase() * mult * boost);

        coinsEl.textContent = Math.floor(coins).toLocaleString('ru-RU');
        tapInfoEl.textContent = 'Удар: +' + effectiveTap;
        autoInfoEl.textContent = 'Авто: +' + effectiveAuto + '/с • Крит: ' + Math.round(getCritChance() * 100) + '%';

        coreBtn.classList.toggle('overdrive', overdriveLeft > 0);
        if (overdriveLeft > 0) {
          surgeBtn.disabled = true;
          surgeBtn.textContent = '🔥 ПЕРЕГРУЗ x2 (' + overdriveLeft.toFixed(1) + 'с)';
        } else if (surgeCooldown > 0) {
          surgeBtn.disabled = true;
          surgeBtn.textContent = '⏳ Перезарядка (' + Math.ceil(surgeCooldown) + 'с)';
        } else {
          surgeBtn.disabled = false;
          surgeBtn.textContent = '⚡ Перегруз x2 (7с)';
        }

        drone1.style.display = autoLvl >= 1 ? 'block' : 'none';
        drone2.style.display = autoLvl >= 4 ? 'block' : 'none';

        const cTap = getTapCost();
        statTap.textContent = 'Ур. ' + tapLvl + ' • база +' + getTapBase();
        buyTapBtn.textContent = 'Качнуть • ' + cTap;
        buyTapBtn.disabled = coins < cTap;

        const cAuto = getAutoCost();
        statAuto.textContent = 'Ур. ' + autoLvl + ' • база +' + getAutoBase() + '/с';
        buyAutoBtn.textContent = 'Качнуть • ' + cAuto;
        buyAutoBtn.disabled = coins < cAuto;

        const cCrit = getCritCost();
        statCrit.textContent = 'Ур. ' + critLvl + ' • ' + Math.round(getCritChance() * 100) + '% (x3)';
        buyCritBtn.textContent = 'Качнуть • ' + cCrit;
        buyCritBtn.disabled = coins < cCrit;

        const cMult = getMultCost();
        statMult.textContent = 'Ур. ' + multLvl + ' • x' + mult.toFixed(2) + ' бонус';
        buyMultBtn.textContent = 'Качнуть • ' + cMult;
        buyMultBtn.disabled = coins < cMult;
      }

      function tick(now) {
        const dt = Math.min(0.1, (now - lastTime) / 1000);
        lastTime = now;

        if (overdriveLeft > 0) overdriveLeft = Math.max(0, overdriveLeft - dt);
        if (surgeCooldown > 0) surgeCooldown = Math.max(0, surgeCooldown - dt);

        if (autoLvl >= 1) {
          droneAngle += dt * (overdriveLeft > 0 ? 4.2 : 2.1);
          const r = 92;
          const cx = 105 - 11;
          const cy = 105 - 11;
          drone1.style.left = (cx + Math.cos(droneAngle) * r) + 'px';
          drone1.style.top = (cy + Math.sin(droneAngle) * r) + 'px';

          if (autoLvl >= 4) {
            drone2.style.left = (cx + Math.cos(droneAngle + Math.PI) * r) + 'px';
            drone2.style.top = (cy + Math.sin(droneAngle + Math.PI) * r) + 'px';
          }

          autoAcc += dt;
          if (autoAcc >= 1) {
            autoAcc -= 1;
            hitCore(undefined, undefined, true);
          }
        }

        updateUI();
        requestAnimationFrame(tick);
      }

      setInterval(saveGame, 2500);
      updateUI();
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
